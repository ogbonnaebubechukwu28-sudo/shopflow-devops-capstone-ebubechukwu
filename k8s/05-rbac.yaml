apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: shopflow
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: shopflow
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: shopflow
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: shopflow
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shopflow-viewer
  namespace: shopflow
  labels:
    app.kubernetes.io/part-of: shopflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shopflow-viewer
  namespace: shopflow
  labels:
    app.kubernetes.io/part-of: shopflow
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shopflow-viewer
  namespace: shopflow
  labels:
    app.kubernetes.io/part-of: shopflow
subjects:
  - kind: ServiceAccount
    name: shopflow-viewer
    namespace: shopflow
roleRef:
  kind: Role
  name: shopflow-viewer
  apiGroup: rbac.authorization.k8s.io
