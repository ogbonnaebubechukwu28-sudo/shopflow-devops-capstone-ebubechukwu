apiVersion: v1
kind: Service
metadata:
  name: backend-green
  namespace: shopflow
  labels:
    app.kubernetes.io/name: backend-green
    app.kubernetes.io/part-of: shopflow
spec:
  selector:
    app.kubernetes.io/name: backend-green
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-green
  namespace: shopflow
  labels:
    app.kubernetes.io/name: backend-green
    app.kubernetes.io/part-of: shopflow
    track: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-green
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
      labels:
        app.kubernetes.io/name: backend-green
        app.kubernetes.io/part-of: shopflow
        track: green
    spec:
      serviceAccountName: backend
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: shopflow-api:1.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shopflow-secret
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: shopflow-config
                  key: REDIS_URL
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: shopflow-config
                  key: PORT
            - name: APP_VERSION
              value: "1.0.2"
            - name: SIMULATE_FAILURE
              value: "true"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
