<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ShopFlow</title>
<style>body{font-family:Arial,sans-serif;max-width:1000px;margin:40px auto;padding:0 20px;background:#f6f7f9;color:#222}.subtitle{color:#666;margin-bottom:30px}#products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}button{border:0;padding:10px 14px;border-radius:6px;cursor:pointer}.status{margin:15px 0;padding:10px;background:#fff;border-radius:6px}</style>
</head>
<body><h1>ShopFlow</h1><p class="subtitle">Simple e-commerce application for a DevOps engineering capstone.</p><div id="status" class="status">Loading products...</div><div id="products"></div>
<script>
async function loadProducts(){const status=document.getElementById('status'),container=document.getElementById('products');try{const response=await fetch('/api/products');if(!response.ok)throw new Error('Unable to load products');const products=await response.json();status.textContent=products.length?`${products.length} product(s) available.`:'No products available.';container.innerHTML=products.map(p=>`<div class="card"><h3>${escapeHtml(p.name)}</h3><p>${escapeHtml(p.description||'')}</p><strong>₦${Number(p.price).toLocaleString()}</strong><p>Stock: ${p.stock}</p><button onclick="placeOrder(${p.id})">Buy 1</button></div>`).join('')}catch(e){status.textContent=e.message}}
async function placeOrder(productId){const response=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product_id:productId,quantity:1})});const data=await response.json();if(!response.ok){alert(data.error||'Order failed');return}alert(`Order #${data.order_id} confirmed. Total: ₦${Number(data.total).toLocaleString()}`);loadProducts()}
function escapeHtml(value){return String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}loadProducts();
</script></body></html>
