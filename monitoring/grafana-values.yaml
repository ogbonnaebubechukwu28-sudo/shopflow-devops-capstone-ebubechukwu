# Lean Grafana for a small laptop. No persistence, small limits.
# The admin password is generated by the chart into the "grafana" Secret,
# so no credential is stored in Git.
persistence:
  enabled: false
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 400Mi
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: shopflow
        orgId: 1
        folder: ShopFlow
        type: file
        disableDeletion: false
        options:
          path: /var/lib/grafana/dashboards/shopflow
dashboardsConfigMaps:
  shopflow: shopflow-dashboard
livenessProbe:
  initialDelaySeconds: 300
  timeoutSeconds: 10
readinessProbe:
  initialDelaySeconds: 60
  timeoutSeconds: 10
