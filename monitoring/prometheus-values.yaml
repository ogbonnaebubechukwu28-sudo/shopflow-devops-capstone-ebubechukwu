# Lean Prometheus for a 4 GB laptop: no Alertmanager, Pushgateway or node-exporter.
# kube-state-metrics stays on (pod restarts and workload health come from it).
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
prometheus-node-exporter:
  enabled: false
kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi

server:
  retention: 2d
  global:
    scrape_interval: 30s
    evaluation_interval: 30s
  persistentVolume:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

serverFiles:
  alerting_rules.yml:
    groups:
      - name: shopflow
        rules:
          - alert: BackendHighErrorRate
            expr: |
              sum(rate(flask_http_request_total{namespace="shopflow",status=~"5.."}[2m]))
                / sum(rate(flask_http_request_total{namespace="shopflow"}[2m])) > 0.05
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "More than 5% of backend requests are failing with 5xx errors"
          - alert: BackendHighLatency
            expr: |
              histogram_quantile(0.95,
                sum by (le) (rate(flask_http_request_duration_seconds_bucket{namespace="shopflow"}[5m]))) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Backend p95 latency is above 1 second"
          - alert: PodRestartingFrequently
            expr: increase(kube_pod_container_status_restarts_total{namespace="shopflow"}[15m]) > 2
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "A ShopFlow container restarted more than twice in 15 minutes"
          - alert: DeploymentReplicasUnavailable
            expr: |
              kube_deployment_status_replicas_available{namespace="shopflow"}
                < kube_deployment_spec_replicas{namespace="shopflow"}
            for: 3m
            labels:
              severity: critical
            annotations:
              summary: "A ShopFlow deployment has fewer available replicas than desired"
