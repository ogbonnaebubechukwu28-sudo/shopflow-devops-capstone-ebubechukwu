name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application/backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: application/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install flake8

      - name: Lint Python (flake8)
        run: flake8 app.py test_smoke.py --max-line-length=170 --extend-ignore=E402,E701,E702,E231,E302,E305

      - name: Lint backend Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: application/backend/Dockerfile

      - name: Lint frontend Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: application/frontend/Dockerfile

      - name: Run tests
        run: pytest -v

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r application/backend/requirements.txt

  build-and-scan-images:
    runs-on: ubuntu-latest
    needs: [lint-and-test, dependency-scan]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t shopflow-api:ci application/backend

      - name: Build frontend image
        run: docker build -t shopflow-frontend:ci application/frontend

      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: shopflow-api:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: shopflow-frontend:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
